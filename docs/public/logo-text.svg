<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="100%" height="100%">
  <defs>
    <linearGradient id="nexusEngineGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="50%" stop-color="#00bbf9" />
      <stop offset="100%" stop-color="#7b2cbf" />
    </linearGradient>
    
    <style>
      .brand-text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 28px; }
      .mode-dependent-text { fill: #1e293b; }
      @media (prefers-color-scheme: dark) {
        .mode-dependent-text { fill: #f8fafc; }
      }
    </style>
  </defs>

  <g transform="translate(15, 10)">
    <path d="M 25,15 L 10,40 L 25,65" fill="none" stroke="url(#nexusEngineGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 55,15 L 70,40 L 55,65" fill="none" stroke="url(#nexusEngineGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="40,18 57,40 40,62 23,40" fill="url(#nexusEngineGrad)" opacity="0.15"/>
    <line x1="40" y1="18" x2="40" y2="62" stroke="url(#nexusEngineGrad)" stroke-width="1.5" stroke-dasharray="3 3"/>
    <line x1="23" y1="40" x2="57" y2="40" stroke="url(#nexusEngineGrad)" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle cx="40" cy="18" r="3.5" fill="#7b2cbf" />
    <circle cx="57" cy="40" r="3.5" fill="#00bbf9" />
    <circle cx="40" cy="62" r="3.5" fill="#00f5d4" />
    <circle cx="23" cy="40" r="3.5" fill="#00bbf9" />
    <circle cx="40" cy="40" r="7" fill="url(#nexusEngineGrad)" />
    <circle cx="40" cy="40" r="2.5" fill="#ffffff" />
  </g>

  <text x="110" y="58" class="brand-text mode-dependent-text" font-weight="800" letter-spacing="-0.5px">Full-Stack</text>
  <text x="248" y="58" class="brand-text" font-weight="300" fill="url(#nexusEngineGrad)" letter-spacing="1.5px">NEXUS</text>
</svg>
