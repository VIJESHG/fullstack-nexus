name: Deploy VitePress site to Pages

on:
  push:
    branches: [main]

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for gitinfo plugin support

      - name: Setup Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm # <-- node-version and cache belong safely here!

      - name: Setup GitHub Pages Infrastructure
        uses: actions/configure-pages@v4 # Clean, no unexpected inputs here

      - name: Install Project Dependencies
        run: npm ci

      - name: Compile VitePress Production Bundle
        run: npm run docs:build

      - name: Upload Build Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

      - name: Deploy Artifacts to GitHub Pages Domain
        id: deployment
        uses: actions/deploy-pages@v4