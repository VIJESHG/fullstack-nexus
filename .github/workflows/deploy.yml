name: Deploy VitePress site to Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    
    # Injects the environment token to force actions to run cleanly on Node 24 
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: 24 # Bumped up to Node 24
          cache: npm

      - name: Setup GitHub Pages Infrastructure
        uses: actions/configure-pages@v4

      - name: Install Project Dependencies
        run: npm ci

      - name: Compile VitePress Production Bundle
        run: npm run docs:build

      - name: Upload Build Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

      - name: Deploy Artifacts to GitHub Pages Domain
        id: deployment
        uses: actions/deploy-pages@v4
